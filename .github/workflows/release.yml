name: Build & release rootfs

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      alpine_version:
        description: "Alpine version (e.g. 3.23.3). Must be a real x.y.z release."
        required: false
        default: "3.23.3"
  schedule:
    # Weekly rebuild to pick up Alpine point releases / security fixes.
    - cron: "17 6 * * 1"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # Native arm64: the self-hosted ubuntu runners can't register QEMU
    # binfmt with their Docker daemon, so arm64 containers fail to exec.
    runs-on: ubuntu-24.04-arm
    env:
      ARCH: aarch64
      ALPINE_VERSION: ${{ github.event.inputs.alpine_version || '3.23.3' }}
    steps:
      - uses: actions/checkout@v6

      - name: Build rootfs
        run: ./build/build.sh

      - name: Compute release tag
        id: meta
        run: |
          DATE=$(date -u +%Y%m%d-%H%M)
          TAG="v${ALPINE_VERSION}-${DATE}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Alpine ${ALPINE_VERSION} (${ARCH}) — ${DATE} UTC" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          make_latest: "true"
          generate_release_notes: true
          files: |
            dist/alpine-aarch64-rootfs.tar.gz
            dist/alpine-aarch64-rootfs.tar.gz.sha256
            dist/alpine-aarch64-rootfs.tar.zst
            dist/alpine-aarch64-rootfs.tar.zst.sha256

  cleanup:
    name: Delete workflow artifacts
    needs: build
    if: ${{ always() }}
    runs-on:
      group: ubuntu
      labels: medium
    permissions:
      actions: write
    steps:
      - name: Delete artifacts from this run
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                ...context.repo,
                run_id: context.runId,
                per_page: 100,
              },
            );
            for (const artifact of artifacts) {
              await github.rest.actions.deleteArtifact({
                ...context.repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted ${artifact.name} (${artifact.id})`);
            }
